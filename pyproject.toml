[project]
name = "greenlight"
version = "0.1.0"
description = "GreenLight: an AI agent that diagnoses failed CI builds and proposes verified fixes"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "sqlmodel>=0.0.16",
    "pygithub>=2.3",
    "openai>=1.30",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
